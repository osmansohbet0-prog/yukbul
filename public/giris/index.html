<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Giriş ve hesap oluştur | Yük Vinç</title><link rel="stylesheet" href="/assets/site.css"></head><body><header><div class="nav wrap"><a class="brand" href="/">Yük Vinç</a><a class="post-btn" href="/">Pazaryerine dön</a></div></header><main class="wrap section narrow account-wrap"><section class="account-card"><p class="eyebrow">YÜKVİNÇ PAZARYERİ</p><h1>Hesabına giriş yap</h1><div id="google-auth-container" class="google-auth" hidden><div id="google-auth-button"></div><p class="form-hint">Google hesabınla güvenli şekilde devam et.</p></div><div class="account-tabs"><button type="button" data-auth-tab="login" class="selected">Giriş yap</button><button type="button" data-auth-tab="register">Hesap oluştur</button></div><form id="auth-form" class="account-form"><label>E-posta<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>Şifre<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"><small>En az 12 karakter.</small></label><label id="password-confirm-wrap" hidden>Şifreyi tekrar yaz<input name="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><label class="hp-field" aria-hidden="true">Boş bırak<input name="website" tabindex="-1" autocomplete="off"></label><div id="turnstile-box" class="turnstile-box" aria-live="polite">Bot koruması yükleniyor…</div><p class="privacy-line">Hesap oluşturarak <a href="/gizlilik/">KVKK aydınlatma metnini</a> okuduğunu kabul edersin.</p><button class="button" id="auth-submit" type="submit">Giriş yap →</button><p id="auth-status" class="form-status" role="status"></p></form></section></main><script src="/assets/auth.js" defer></script><script src="/assets/sidebar.js" defer></script></body></html>
