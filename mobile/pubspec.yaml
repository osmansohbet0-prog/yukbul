publish_to: none
version: 0.8.0+8

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  http: ^1.5.0
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  shared_preferences: ^2.5.4
  app_links: ^6.4.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  open_filex: ^4.7.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
