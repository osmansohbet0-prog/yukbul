name: yukvinc_mobile
description: "YükVinç mobil uygulaması: ilanlar, iş fırsatları ve yakındaki hizmetler."
publish_to: none
version: 1.5.0+18

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  html: ^0.15.6
  http: ^1.5.0
  url_launcher: ^6.3.3
  geolocator: ^14.1.2
  shared_preferences: ^2.5.4
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/turkey-locations.json
    - assets/location-data-license.txt
