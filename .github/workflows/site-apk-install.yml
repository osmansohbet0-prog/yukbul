name: Test Android installation from the public site
on:
  push:
    branches: [test/site-apk-install-132]
    paths: [.github/workflows/site-apk-install.yml]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the same file served to a visitor and verify it against the release
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://yukvinc.com.tr/indir/android?utm_source=install-test' -o /tmp/yv-site.apk
          echo '48ac01234689db4cc5fe45880ef38a435cc54ab22057112f58834b393427fb47  /tmp/yv-site.apk' | sha256sum -c -
          curl --retry 3 -fsSL 'https://github.com/osmansohbet0-prog/yukbul/releases/download/yukvinc-android-v0.6.0/YukVinc-Android-0.6.0.apk' -o /tmp/yv-previous.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the website APK both fresh and over the old website version
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install /tmp/yv-site.apk
            adb shell am start -W -n tr.com.yukvinc.yukvinc_mobile.android/tr.com.yukvinc.yukvinc_mobile.MainActivity
            adb uninstall tr.com.yukvinc.yukvinc_mobile.android
            adb install /tmp/yv-previous.apk
            adb install -r /tmp/yv-site.apk
            adb shell dumpsys package tr.com.yukvinc.yukvinc_mobile.android | grep -F versionName=1.3.2
            adb shell am start -W -n tr.com.yukvinc.yukvinc_mobile.android/tr.com.yukvinc.yukvinc_mobile.MainActivity
